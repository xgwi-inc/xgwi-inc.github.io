name: Update CB Articles

on:
  schedule:
    # 毎日 JST 7:00 (UTC 22:00 前日) と JST 19:00 (UTC 10:00) に実行
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch CB articles
        run: python scripts/fetch_cb_articles.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cb_articles.json
          git diff --cached --quiet && exit 0
          git commit -m "update cb_articles.json ($(date -u +%Y-%m-%dT%H:%M)Z)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
