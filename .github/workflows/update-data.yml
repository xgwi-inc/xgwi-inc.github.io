name: Update Economic Data

on:
  schedule:
    # 毎日 JST 8:00 (UTC 23:00 前日) に実行
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update economic data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_data.py

      - name: Verify data freshness
        run: python scripts/verify_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us.json data/ca.json data/eu.json data/gb.json data/au.json data/jp.json
          git diff --cached --quiet || git commit -m "update economic data ($(date -u +%Y-%m-%dT%H:%M)Z)"
          git push
