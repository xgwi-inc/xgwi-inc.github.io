<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>経済指標カレンダー | 合同会社xgwi</title>
  <meta name="description" content="主要国の経済指標発表スケジュール">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #fafaf9;
      --color-surface: #ffffff;
      --color-text: #1c1917;
      --color-text-secondary: #57534e;
      --color-text-tertiary: #a8a29e;
      --color-accent: #1e3a5f;
      --color-accent-light: #2d5a8e;
      --color-border: #e7e5e4;
      --color-border-light: #f0efed;
      --font-jp: 'Noto Sans JP', sans-serif;
      --font-en: 'DM Sans', sans-serif;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-jp);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(250, 250, 249, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--color-border-light);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-en);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--color-accent);
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .logo span {
      font-weight: 400;
      font-size: 0.75rem;
      color: var(--color-text-secondary);
      margin-right: 0.5rem;
      font-family: var(--font-jp);
      letter-spacing: 0.08em;
    }

    nav a {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      text-decoration: none;
      margin-left: 2rem;
      transition: color 0.2s;
      letter-spacing: 0.04em;
    }

    nav a:hover {
      color: var(--color-accent);
    }

    /* ── Main ── */
    .page-hero {
      padding: 8rem 2rem 3rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .page-hero .hero-eyebrow {
      font-family: var(--font-en);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .page-hero h1 {
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }

    .page-hero p {
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      line-height: 1.9;
    }

    /* ── Legend ── */
    .legend {
      max-width: 960px;
      margin: 0 auto 1.5rem;
      padding: 0 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }

    .legend-section {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1rem;
      align-items: center;
    }

    .legend-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-right: 0.25rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      color: var(--color-text-secondary);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── Calendar ── */
    .calendar-container {
      max-width: 960px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
    }

    .calendar-month {
      font-family: var(--font-en);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-accent);
      margin-bottom: 1rem;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--color-surface);
    }

    .cal-header {
      background: var(--color-accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      padding: 0.5rem 0.25rem;
      letter-spacing: 0.05em;
    }

    .cal-header.sun { color: #fca5a5; }
    .cal-header.sat { color: #93c5fd; }

    .cal-cell {
      min-height: 110px;
      border-top: 1px solid var(--color-border-light);
      border-right: 1px solid var(--color-border-light);
      padding: 0.3rem;
      position: relative;
      background: var(--color-surface);
    }

    .cal-cell:nth-child(7n) {
      border-right: none;
    }

    .cal-cell.empty {
      background: #f5f5f4;
    }

    .cal-cell.today {
      background: #eff6ff;
      box-shadow: inset 0 0 0 2px var(--color-accent-light);
    }

    .cal-cell.past {
      background: #fafaf9;
    }

    .cal-day {
      font-family: var(--font-en);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 0.2rem;
      padding: 0.1rem 0.3rem;
    }

    .cal-cell.sun .cal-day { color: #dc2626; }
    .cal-cell.sat .cal-day { color: #2563eb; }

    .cal-events {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .cal-event {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.6rem;
      line-height: 1.4;
      cursor: default;
      transition: opacity 0.15s;
    }

    .cal-event:hover {
      opacity: 0.8;
    }

    .cal-event .flag {
      flex-shrink: 0;
      font-size: 0.65rem;
    }

    .cal-event .ev-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cal-event .ev-time {
      margin-left: auto;
      font-family: var(--font-en);
      font-size: 0.55rem;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .cal-event.past-event {
      opacity: 0.45;
    }

    /* Indicator type colors */
    .cal-event.type-rate     { background: #dbeafe; color: #1e40af; }
    .cal-event.type-cpi      { background: #fce7f3; color: #9d174d; }
    .cal-event.type-ppi      { background: #fef3c7; color: #92400e; }
    .cal-event.type-unemp    { background: #d1fae5; color: #065f46; }

    /* ── List view (mobile) ── */
    .calendar-list {
      display: none;
      max-width: 960px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
    }

    .list-day {
      margin-bottom: 1rem;
    }

    .list-day-header {
      font-family: var(--font-en);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-accent);
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 0.4rem;
    }

    .list-day-header.today {
      color: #dc2626;
    }

    .list-event {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    .list-event .ev-time {
      font-family: var(--font-en);
      font-size: 0.7rem;
      font-weight: 500;
      min-width: 3rem;
    }

    .list-event.past-event {
      opacity: 0.45;
    }

    @media (max-width: 700px) {
      .calendar-container { display: none; }
      .calendar-list { display: block; }
      .legend { padding: 0 1rem; }
      .page-hero { padding: 7rem 1rem 2rem; }
    }

    /* ── Month Nav ── */
    .month-nav {
      max-width: 960px;
      margin: 0 auto 1.5rem;
      padding: 0 2rem;
      display: flex;
      gap: 0.5rem;
    }

    .month-btn {
      padding: 0.4rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-surface);
      font-family: var(--font-en);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .month-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .month-btn.active {
      background: var(--color-accent);
      color: #fff;
      border-color: var(--color-accent);
    }

    @media (max-width: 700px) {
      .month-nav { padding: 0 1rem; }
    }

    /* ── Footer ── */
    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 2rem;
      border-top: 1px solid var(--color-border);
      text-align: center;
      font-size: 0.75rem;
      color: var(--color-text-tertiary);
    }

    .footer-logo {
      font-family: var(--font-en);
      font-weight: 700;
      font-size: 1rem;
      color: var(--color-accent);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo"><span>合同会社</span>xgwi</a>
      <nav>
        <a href="index.html">ホーム</a>
        <a href="data.html">経済指標</a>
        <a href="calendar.html">カレンダー</a>
        <a href="cb-articles.html">CB発言</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <div class="page-hero">
    <div class="hero-eyebrow">Economic Calendar</div>
    <h1>指標発表カレンダー</h1>
    <p>主要6カ国の政策金利・CPI・PPI・失業率の発表予定（日本時間）</p>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-section">
      <span class="legend-title">指標:</span>
      <span class="legend-item"><span class="legend-dot" style="background:#dbeafe;border:1px solid #93c5fd"></span>政策金利</span>
      <span class="legend-item"><span class="legend-dot" style="background:#fce7f3;border:1px solid #f9a8d4"></span>CPI</span>
      <span class="legend-item"><span class="legend-dot" style="background:#fef3c7;border:1px solid #fcd34d"></span>PPI</span>
      <span class="legend-item"><span class="legend-dot" style="background:#d1fae5;border:1px solid #6ee7b7"></span>失業率</span>
    </div>
  </div>

  <!-- Month navigation -->
  <div class="month-nav" id="month-nav"></div>

  <!-- Calendar Grid (desktop) -->
  <div class="calendar-container">
    <div class="calendar-month" id="cal-month-title"></div>
    <div class="calendar-grid" id="cal-grid"></div>
  </div>

  <!-- List view (mobile) -->
  <div class="calendar-list" id="cal-list"></div>

  <!-- Footer -->
  <footer>
    <div class="footer-logo">xgwi LLC</div>
    <div>&copy; 2026 合同会社xgwi. All rights reserved.</div>
  </footer>

  <script>
    const DOW_LABELS = ['日', '月', '火', '水', '木', '金', '土'];
    const MONTH_NAMES = ['', 'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'];

    let calendarData = null;
    let currentMonth = null;

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function firstDayOfWeek(year, month) {
      return new Date(year, month - 1, 1).getDay();
    }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function renderMonth(ym) {
      currentMonth = ym;
      const [year, month] = ym.split('-').map(Number);
      const days = daysInMonth(year, month);
      const fdow = firstDayOfWeek(year, month);
      const today = todayStr();
      const events = calendarData.events.filter(e => e.date.startsWith(ym));

      // Update nav active state
      document.querySelectorAll('.month-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.month === ym);
      });

      // Title
      document.getElementById('cal-month-title').textContent = `${MONTH_NAMES[month]} ${year}`;

      // Grid
      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';
      DOW_LABELS.forEach((d, i) => {
        const el = document.createElement('div');
        el.className = 'cal-header' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
        el.textContent = d;
        grid.appendChild(el);
      });

      for (let i = 0; i < fdow; i++) {
        const el = document.createElement('div');
        el.className = 'cal-cell empty';
        grid.appendChild(el);
      }

      for (let day = 1; day <= days; day++) {
        const dateStr = `${ym}-${String(day).padStart(2, '0')}`;
        const dow = (fdow + day - 1) % 7;
        const cell = document.createElement('div');
        const classes = ['cal-cell'];
        if (dow === 0) classes.push('sun');
        if (dow === 6) classes.push('sat');
        if (dateStr === today) classes.push('today');
        if (dateStr < today) classes.push('past');
        cell.className = classes.join(' ');

        const dayLabel = document.createElement('div');
        dayLabel.className = 'cal-day';
        dayLabel.textContent = day;
        cell.appendChild(dayLabel);

        const dayEvents = events.filter(e => e.date === dateStr)
          .sort((a, b) => a.time.localeCompare(b.time));

        if (dayEvents.length > 0) {
          const evContainer = document.createElement('div');
          evContainer.className = 'cal-events';
          dayEvents.forEach(ev => {
            const isPast = dateStr < today;
            const evEl = document.createElement('div');
            evEl.className = `cal-event type-${ev.type}${isPast ? ' past-event' : ''}`;
            evEl.title = `${ev.flag} ${ev.label}\n${ev.time} JST`;
            evEl.innerHTML = `
              <span class="flag">${ev.flag}</span>
              <span class="ev-text">${ev.label}</span>
              <span class="ev-time">${ev.time}</span>`;
            evContainer.appendChild(evEl);
          });
          cell.appendChild(evContainer);
        }
        grid.appendChild(cell);
      }

      // List view (mobile)
      const list = document.getElementById('cal-list');
      list.innerHTML = '';
      const daysWithEvents = [...new Set(events.map(e => e.date))].sort();

      daysWithEvents.forEach(dateStr => {
        const day = parseInt(dateStr.split('-')[2], 10);
        const dow = (fdow + day - 1) % 7;
        const dayDiv = document.createElement('div');
        dayDiv.className = 'list-day';

        const header = document.createElement('div');
        header.className = 'list-day-header' + (dateStr === today ? ' today' : '');
        header.textContent = `${month}/${day}（${DOW_LABELS[dow]}）`;
        dayDiv.appendChild(header);

        events.filter(e => e.date === dateStr)
          .sort((a, b) => a.time.localeCompare(b.time))
          .forEach(ev => {
            const isPast = dateStr < today;
            const evEl = document.createElement('div');
            evEl.className = `list-event type-${ev.type}${isPast ? ' past-event' : ''}`;
            evEl.innerHTML = `
              <span class="ev-time">${ev.time}</span>
              <span class="flag">${ev.flag}</span>
              <span class="ev-text">${ev.label}</span>`;
            dayDiv.appendChild(evEl);
          });
        list.appendChild(dayDiv);
      });
    }

    function buildMonthNav(months) {
      const nav = document.getElementById('month-nav');
      months.forEach(ym => {
        const [y, m] = ym.split('-').map(Number);
        const btn = document.createElement('button');
        btn.className = 'month-btn';
        btn.dataset.month = ym;
        btn.textContent = `${y}年${m}月`;
        btn.addEventListener('click', () => renderMonth(ym));
        nav.appendChild(btn);
      });
    }

    // Load data and render
    fetch('data/calendar.json')
      .then(r => r.json())
      .then(data => {
        calendarData = data;
        buildMonthNav(data.months);
        // Show current month if available, otherwise first month
        const today = todayStr().slice(0, 7);
        const startMonth = data.months.includes(today) ? today : data.months[0];
        renderMonth(startMonth);
      })
      .catch(err => {
        document.getElementById('cal-grid').innerHTML =
          '<div style="grid-column:1/-1;padding:2rem;text-align:center;color:#a8a29e">データの読み込みに失敗しました</div>';
      });
  </script>
</body>
</html>
