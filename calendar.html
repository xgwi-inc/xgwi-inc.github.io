<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>経済指標カレンダー | 合同会社xgwi</title>
  <meta name="description" content="主要国の経済指標発表スケジュール">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #fafaf9;
      --color-surface: #ffffff;
      --color-text: #1c1917;
      --color-text-secondary: #57534e;
      --color-text-tertiary: #a8a29e;
      --color-accent: #1e3a5f;
      --color-accent-light: #2d5a8e;
      --color-border: #e7e5e4;
      --color-border-light: #f0efed;
      --font-jp: 'Noto Sans JP', sans-serif;
      --font-en: 'DM Sans', sans-serif;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-jp);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(250, 250, 249, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--color-border-light);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-en);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--color-accent);
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .logo span {
      font-weight: 400;
      font-size: 0.75rem;
      color: var(--color-text-secondary);
      margin-right: 0.5rem;
      font-family: var(--font-jp);
      letter-spacing: 0.08em;
    }

    nav a {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      text-decoration: none;
      margin-left: 2rem;
      transition: color 0.2s;
      letter-spacing: 0.04em;
    }

    nav a:hover {
      color: var(--color-accent);
    }

    /* ── Main ── */
    .page-hero {
      padding: 8rem 2rem 3rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .page-hero .hero-eyebrow {
      font-family: var(--font-en);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .page-hero h1 {
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }

    .page-hero p {
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      line-height: 1.9;
    }

    /* ── Legend ── */
    .legend {
      max-width: 960px;
      margin: 0 auto 1.5rem;
      padding: 0 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }

    .legend-section {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1rem;
      align-items: center;
    }

    .legend-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-right: 0.25rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      color: var(--color-text-secondary);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── Calendar ── */
    .calendar-container {
      max-width: 960px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
    }

    .calendar-month {
      font-family: var(--font-en);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-accent);
      margin-bottom: 1rem;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--color-surface);
    }

    .cal-header {
      background: var(--color-accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      padding: 0.5rem 0.25rem;
      letter-spacing: 0.05em;
    }

    .cal-header.sun { color: #fca5a5; }
    .cal-header.sat { color: #93c5fd; }

    .cal-cell {
      min-height: 110px;
      border-top: 1px solid var(--color-border-light);
      border-right: 1px solid var(--color-border-light);
      padding: 0.3rem;
      position: relative;
      background: var(--color-surface);
    }

    .cal-cell:nth-child(7n) {
      border-right: none;
    }

    .cal-cell.empty {
      background: #f5f5f4;
    }

    .cal-cell.today {
      background: #eff6ff;
      box-shadow: inset 0 0 0 2px var(--color-accent-light);
    }

    .cal-cell.past {
      background: #fafaf9;
    }

    .cal-day {
      font-family: var(--font-en);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 0.2rem;
      padding: 0.1rem 0.3rem;
    }

    .cal-cell.sun .cal-day { color: #dc2626; }
    .cal-cell.sat .cal-day { color: #2563eb; }

    .cal-events {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .cal-event {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.6rem;
      line-height: 1.4;
      cursor: default;
      transition: opacity 0.15s;
    }

    .cal-event:hover {
      opacity: 0.8;
    }

    .cal-event .flag {
      flex-shrink: 0;
      font-size: 0.65rem;
    }

    .cal-event .ev-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cal-event .ev-time {
      margin-left: auto;
      font-family: var(--font-en);
      font-size: 0.55rem;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .cal-event.past-event {
      opacity: 0.45;
    }

    /* Indicator type colors */
    .cal-event.type-rate     { background: #dbeafe; color: #1e40af; }
    .cal-event.type-cpi      { background: #fce7f3; color: #9d174d; }
    .cal-event.type-ppi      { background: #fef3c7; color: #92400e; }
    .cal-event.type-unemp    { background: #d1fae5; color: #065f46; }

    /* ── List view (mobile) ── */
    .calendar-list {
      display: none;
      max-width: 960px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
    }

    .list-day {
      margin-bottom: 1rem;
    }

    .list-day-header {
      font-family: var(--font-en);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-accent);
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 0.4rem;
    }

    .list-day-header.today {
      color: #dc2626;
    }

    .list-event {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    .list-event .ev-time {
      font-family: var(--font-en);
      font-size: 0.7rem;
      font-weight: 500;
      min-width: 3rem;
    }

    .list-event.past-event {
      opacity: 0.45;
    }

    @media (max-width: 700px) {
      .calendar-container { display: none; }
      .calendar-list { display: block; }
      .legend { padding: 0 1rem; }
      .page-hero { padding: 7rem 1rem 2rem; }
    }

    /* ── Footer ── */
    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 2rem;
      border-top: 1px solid var(--color-border);
      text-align: center;
      font-size: 0.75rem;
      color: var(--color-text-tertiary);
    }

    .footer-logo {
      font-family: var(--font-en);
      font-weight: 700;
      font-size: 1rem;
      color: var(--color-accent);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo"><span>合同会社</span>xgwi</a>
      <nav>
        <a href="index.html">ホーム</a>
        <a href="data.html">経済指標</a>
        <a href="calendar.html">カレンダー</a>
        <a href="cb-articles.html">CB発言</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <div class="page-hero">
    <div class="hero-eyebrow">Economic Calendar</div>
    <h1>指標発表カレンダー</h1>
    <p>主要6カ国の政策金利・CPI・PPI・失業率の発表予定（日本時間）</p>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-section">
      <span class="legend-title">指標:</span>
      <span class="legend-item"><span class="legend-dot" style="background:#dbeafe;border:1px solid #93c5fd"></span>政策金利</span>
      <span class="legend-item"><span class="legend-dot" style="background:#fce7f3;border:1px solid #f9a8d4"></span>CPI</span>
      <span class="legend-item"><span class="legend-dot" style="background:#fef3c7;border:1px solid #fcd34d"></span>PPI</span>
      <span class="legend-item"><span class="legend-dot" style="background:#d1fae5;border:1px solid #6ee7b7"></span>失業率</span>
    </div>
  </div>

  <!-- Calendar Grid (desktop) -->
  <div class="calendar-container">
    <div class="calendar-month">April 2026</div>
    <div class="calendar-grid" id="cal-grid"></div>
  </div>

  <!-- List view (mobile) -->
  <div class="calendar-list" id="cal-list"></div>

  <!-- Footer -->
  <footer>
    <div class="footer-logo">xgwi LLC</div>
    <div>&copy; 2026 合同会社xgwi. All rights reserved.</div>
  </footer>

  <script>
    // ── Event Data: April 2026 (JST) ──
    const EVENTS = [
      // Apr 3
      { day: 3, time: '21:30', country: 'us', flag: '🇺🇸', type: 'unemp', label: '雇用統計（失業率）' },
      // Apr 8
      { day: 8, time: '19:00', country: 'eu', flag: '🇪🇺', type: 'ppi', label: 'PPI' },
      // Apr 10
      { day: 10, time: '08:50', country: 'jp', flag: '🇯🇵', type: 'ppi', label: 'CGPI（企業物価指数）' },
      { day: 10, time: '21:30', country: 'ca', flag: '🇨🇦', type: 'unemp', label: '雇用統計（失業率）' },
      // Apr 11
      { day: 11, time: '21:30', country: 'us', flag: '🇺🇸', type: 'cpi', label: 'CPI' },
      // Apr 14
      { day: 14, time: '21:30', country: 'us', flag: '🇺🇸', type: 'ppi', label: 'PPI' },
      // Apr 16
      { day: 16, time: '20:00', country: 'eu', flag: '🇪🇺', type: 'cpi', label: 'HICP（確報値）' },
      // Apr 20
      { day: 20, time: '21:30', country: 'ca', flag: '🇨🇦', type: 'cpi', label: 'CPI' },
      // Apr 21
      { day: 21, time: '15:00', country: 'gb', flag: '🇬🇧', type: 'unemp', label: '雇用統計（失業率）' },
      // Apr 22
      { day: 22, time: '15:00', country: 'gb', flag: '🇬🇧', type: 'cpi', label: 'CPI' },
      { day: 22, time: '15:00', country: 'gb', flag: '🇬🇧', type: 'ppi', label: 'PPI' },
      // Apr 23
      { day: 23, time: '10:30', country: 'au', flag: '🇦🇺', type: 'unemp', label: '雇用統計（失業率）' },
      { day: 23, time: '21:30', country: 'ca', flag: '🇨🇦', type: 'ppi', label: 'IPPI（鉱工業製品価格）' },
      // Apr 28
      { day: 28, time: '08:30', country: 'jp', flag: '🇯🇵', type: 'unemp', label: '失業率' },
      { day: 28, time: '12:00', country: 'jp', flag: '🇯🇵', type: 'rate', label: '日銀 金融政策決定会合' },
      // Apr 29
      { day: 29, time: '10:30', country: 'au', flag: '🇦🇺', type: 'cpi', label: 'CPI（月次）' },
      { day: 29, time: '22:45', country: 'ca', flag: '🇨🇦', type: 'rate', label: 'BoC 政策金利発表' },
      // Apr 30 (FOMC is 3:00 JST = after midnight of Apr 29 ET)
      { day: 30, time: '03:00', country: 'us', flag: '🇺🇸', type: 'rate', label: 'FOMC 政策金利発表' },
      { day: 30, time: '19:00', country: 'eu', flag: '🇪🇺', type: 'unemp', label: '失業率' },
      { day: 30, time: '20:00', country: 'gb', flag: '🇬🇧', type: 'rate', label: 'BoE 政策金利発表' },
      { day: 30, time: '21:15', country: 'eu', flag: '🇪🇺', type: 'rate', label: 'ECB 政策金利発表' },
      { day: 30, time: '23:00', country: 'eu', flag: '🇪🇺', type: 'cpi', label: 'HICP速報値（4月）' },
    ];

    const TODAY = 16; // April 16, 2026
    const YEAR = 2026;
    const MONTH = 4;
    const DAYS_IN_MONTH = 30;
    // April 1, 2026 = Wednesday (0=Sun ... 3=Wed)
    const FIRST_DAY_OF_WEEK = 3;

    const DOW_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

    function buildCalendarGrid() {
      const grid = document.getElementById('cal-grid');

      // Day-of-week headers
      DOW_LABELS.forEach((d, i) => {
        const el = document.createElement('div');
        el.className = 'cal-header' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
        el.textContent = d;
        grid.appendChild(el);
      });

      // Empty cells before the 1st
      for (let i = 0; i < FIRST_DAY_OF_WEEK; i++) {
        const el = document.createElement('div');
        el.className = 'cal-cell empty';
        grid.appendChild(el);
      }

      // Day cells
      for (let day = 1; day <= DAYS_IN_MONTH; day++) {
        const dow = (FIRST_DAY_OF_WEEK + day - 1) % 7;
        const cell = document.createElement('div');
        const classes = ['cal-cell'];
        if (dow === 0) classes.push('sun');
        if (dow === 6) classes.push('sat');
        if (day === TODAY) classes.push('today');
        if (day < TODAY) classes.push('past');
        cell.className = classes.join(' ');

        const dayLabel = document.createElement('div');
        dayLabel.className = 'cal-day';
        dayLabel.textContent = day;
        cell.appendChild(dayLabel);

        const dayEvents = EVENTS.filter(e => e.day === day)
          .sort((a, b) => a.time.localeCompare(b.time));

        if (dayEvents.length > 0) {
          const evContainer = document.createElement('div');
          evContainer.className = 'cal-events';

          dayEvents.forEach(ev => {
            const evEl = document.createElement('div');
            const isPast = day < TODAY;
            evEl.className = `cal-event type-${ev.type}${isPast ? ' past-event' : ''}`;
            evEl.title = `${ev.flag} ${ev.label}\n${ev.time} JST`;
            evEl.innerHTML = `
              <span class="flag">${ev.flag}</span>
              <span class="ev-text">${ev.label}</span>
              <span class="ev-time">${ev.time}</span>
            `;
            evContainer.appendChild(evEl);
          });

          cell.appendChild(evContainer);
        }

        grid.appendChild(cell);
      }
    }

    function buildListView() {
      const list = document.getElementById('cal-list');
      const daysWithEvents = [...new Set(EVENTS.map(e => e.day))].sort((a, b) => a - b);

      daysWithEvents.forEach(day => {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'list-day';

        const dow = (FIRST_DAY_OF_WEEK + day - 1) % 7;
        const header = document.createElement('div');
        header.className = 'list-day-header' + (day === TODAY ? ' today' : '');
        header.textContent = `${MONTH}/${day}（${DOW_LABELS[dow]}）`;
        dayDiv.appendChild(header);

        const dayEvents = EVENTS.filter(e => e.day === day)
          .sort((a, b) => a.time.localeCompare(b.time));

        dayEvents.forEach(ev => {
          const isPast = day < TODAY;
          const evEl = document.createElement('div');
          evEl.className = `list-event type-${ev.type}${isPast ? ' past-event' : ''}`;
          evEl.innerHTML = `
            <span class="ev-time">${ev.time}</span>
            <span class="flag">${ev.flag}</span>
            <span class="ev-text">${ev.label}</span>
          `;
          dayDiv.appendChild(evEl);
        });

        list.appendChild(dayDiv);
      });
    }

    buildCalendarGrid();
    buildListView();
  </script>
</body>
</html>
